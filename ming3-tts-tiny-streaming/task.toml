schema_version = "1.4"

[task]
name = "rsi/ming3-tts-tiny-streaming"
version = "1.0.0"
description = "Improve Ming-3.0-tts-tiny streaming TTS serving throughput on SGLang-Omni under strict TTFA, C50 playback continuity, latency, and WER<=2% guards."

[metadata]
author_name = "Chenyang Zhao; Zhuofeng Li"
author_email = "contributor-14@example.invalid; contributor-15@example.invalid"
difficulty_explanation = "Multi-stage TTS serving requires causal profiling and systems optimization across scheduler batching, CUDA graphs, inter-stage IPC, reference conditioning, and audio decoding without regressing tail latency, streaming continuity, or speech intelligibility."
verification_explanation = "Three fresh-process SeedTTS English c16 streaming runs with independent original-source Qwen3-ASR-1.7B verification, strict throughput improvement over reference B0, 3% latency/RTF/TTFA/C50 guards, >=95% multi-chunk streaming coverage, and corpus WER <= 0.02."
category = "ML"
subcategory = "Inference"
tags = ["autoresearch", "tts", "ming3-tts", "streaming", "sglang-omni", "throughput"]
expert_time_estimate_hours = 24
relevant_experience = "SGLang-Omni serving runtime and GPU inference optimization."

[metadata.rsi_harness.verifier]
gpus = 1

[environment]
os = "linux"
cpus = 16
memory_mb = 131072
storage_mb = 204800
build_timeout_sec = 14400
workdir = "/workspace"
gpus = 1
network_mode = "no-network"

[agent]
timeout_sec = 86400
network_mode = "no-network"

[verifier]
timeout_sec = 14400
network_mode = "no-network"
environment_mode = "shared"

[verifier.env]
RSI_BASELINE_JSON = "${RSI_BASELINE_JSON:-}"
RSI_TTS_BASELINE_JSON = "${RSI_TTS_BASELINE_JSON:-}"
RSI_TTS_CPU_LANES = "${RSI_TTS_CPU_LANES:-}"
RSI_TTS_NUMA_LANES = "${RSI_TTS_NUMA_LANES:-}"
