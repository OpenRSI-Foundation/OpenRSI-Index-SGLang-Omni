schema_version = "1.4"

[task]
name = "rsi/qwen3-asr-1.7b-dual-mode"
version = "1.0.0"
description = "Improve fixed-weight Qwen3-ASR-1.7B serving throughput across bilingual (EN/ZH) streaming SSE and non-streaming HTTP workloads on SGLang-Omni."

[metadata]
author_name = "Zhuofeng Li; Chenyang Zhao"
author_email = "contributor-15@example.invalid; contributor-14@example.invalid"
difficulty_explanation = "Audio encoder batching, request-builder concurrency, prefill coalescing, host-to-GPU overlap, and autoregressive decoding trade throughput against tail latency, streaming TTFT, inter-chunk cadence, and transcription accuracy."
verification_explanation = "Twelve fresh-service passes (EN 1,088 + ZH 2,020 clips x non-streaming + SSE streaming x 3 repetitions = 18,648 warmup + 18,648 scored requests at concurrency 32) against fixed reference B0 with strict mode-ratio gains, 3% latency/TTFT/inter-chunk guards, and corpus WER/CER ceilings."
category = "ML"
subcategory = "Inference"
tags = ["autoresearch", "asr", "qwen3-asr", "streaming", "sglang-omni", "throughput"]
expert_time_estimate_hours = 24
relevant_experience = "SGLang-Omni ASR serving and GPU inference optimization."

[metadata.rsi_harness.verifier]
gpus = 1

[environment]
os = "linux"
cpus = 16
memory_mb = 131072
storage_mb = 204800
build_timeout_sec = 14400
workdir = "/workspace"
gpus = 1
network_mode = "no-network"

[environment.env]
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
PYTHONDONTWRITEBYTECODE = "1"
TOKENIZERS_PARALLELISM = "false"

[agent]
timeout_sec = 86400
network_mode = "no-network"

[verifier]
timeout_sec = 10800
network_mode = "no-network"
environment_mode = "shared"

[verifier.env]
RSI_BASELINE_JSON = "${RSI_BASELINE_JSON:-}"
RSI_ASR_CPU_LANES = "${RSI_ASR_CPU_LANES:-}"
